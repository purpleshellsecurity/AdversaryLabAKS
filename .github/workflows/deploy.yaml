# =============================================================================
# deploy.yaml — build OR tear down the live AKS lab in Azure
# =============================================================================
# Runs ONLY when a human clicks "Run workflow" (workflow_dispatch) and fills the
# form below. Unlike validate.yaml, this workflow authenticates to Azure and
# changes real cloud resources. A single form field — `action` — chooses whether
# it deploys or destroys.
#
# Auth model (no passwords anywhere): it logs in via OIDC federated credentials.
# `permissions: id-token: write` lets the job request a short-lived GitHub OIDC
# token; `azure/login@v2` presents that token to Azure; Azure trusts it because
# `tools/setup-oidc.ps1` pre-registered a federated credential scoped to this repo
# + the `lab` environment. The AZURE_* "secrets" are just identifiers, not keys.
# That's why every job below declares `environment: lab`.
#
# Full walkthrough: docs/WORKFLOWS-EXPLAINED.md
# =============================================================================
name: Deploy AKS Adversary Lab

# ── Trigger: a manual form ───────────────────────────────────────────────────
# workflow_dispatch = manual-only. Each `inputs:` entry becomes a form field.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy
          - destroy
      name_prefix:
        description: 'Resource name prefix (lowercase, 3-15 chars, e.g. purpleshell)'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: true
        type: choice
        default: eastus
        options:
          - eastus
          - eastus2
          - westus2
          - centralus
          - uksouth
          - westeurope
      authorized_ip:
        description: 'Your PUBLIC IP for AKS API access in CIDR (e.g. 73.45.123.45/32) — get with `curl ifconfig.me`'
        required: true
        type: string
      admin_group_id:
        description: 'Entra ID group Object ID for AKS cluster-admin'
        required: true
        type: string
      existing_workspace_id:
        description: 'Existing Log Analytics Workspace Resource ID (leave blank to create new)'
        required: false
        type: string

# ── Concurrency ──────────────────────────────────────────────────────────────
# Fixed group (not per-branch) and cancel-in-progress: FALSE — the deliberate
# opposite of validate.yaml. You must NEVER interrupt a half-finished deploy or
# destroy (that could leave Azure in a broken state), so concurrent runs QUEUE
# and wait their turn instead of cancelling.
concurrency:
  group: deploy-lab
  cancel-in-progress: false

# ── Permissions ──────────────────────────────────────────────────────────────
# id-token: write  → allowed to request the OIDC token used to log into Azure.
# contents: read   → allowed to check out the repo. Nothing more is granted.
permissions:
  id-token: write
  contents: read

# ── Workflow-wide variable ───────────────────────────────────────────────────
# Derived once from name_prefix so every job/step names the RG identically.
env:
  RESOURCE_GROUP: rg-${{ github.event.inputs.name_prefix }}-aks-lab

jobs:
  # ── Job 1 of 3: preflight ──────────────────────────────────────────────────
  # ALWAYS runs first. Validates the form inputs and confirms Azure access BEFORE
  # spending 15+ minutes on a deploy. Steps 1-3 need no cloud (pure input checks);
  # steps 4-6 do a cheap Azure round-trip. Nothing is created here.
  # `environment: lab` gates the job behind the lab environment's approval and
  # scopes the OIDC credential.
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate name prefix
        run: |
          PREFIX="${{ github.event.inputs.name_prefix }}"
          if [[ ! "$PREFIX" =~ ^[a-z][a-z0-9]{2,14}$ ]]; then
            echo "::error::name_prefix must be 3-15 lowercase alphanumeric chars starting with a letter. Got: $PREFIX"
            exit 1
          fi
          echo "✓ Name prefix valid: $PREFIX"

      # authorized_ip becomes the AKS API server's allowlist, so it MUST be your
      # real PUBLIC IP. This step checks CIDR shape, rejects octets > 255, and
      # rejects private/reserved ranges (RFC1918, loopback, link-local, multicast,
      # reserved) — a private IP here would lock you out or be meaningless.
      - name: Validate IP range
        run: |
          IP="${{ github.event.inputs.authorized_ip }}"

          if [[ ! "$IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]{1,2}$ ]]; then
            echo "::error::authorized_ip must be in CIDR format (e.g. 73.45.123.45/32). Got: $IP"
            exit 1
          fi

          IP_NUM="${IP%/*}"
          IFS='.' read -r A B C D <<< "$IP_NUM"

          for OCT in "$A" "$B" "$C" "$D"; do
            if (( OCT > 255 )); then
              echo "::error::authorized_ip has invalid octet ($OCT > 255): $IP_NUM"
              exit 1
            fi
          done

          REJECT=""
          if (( A == 10 )); then
            REJECT="RFC 1918 private (10.0.0.0/8)"
          elif (( A == 172 && B >= 16 && B <= 31 )); then
            REJECT="RFC 1918 private (172.16.0.0/12)"
          elif (( A == 192 && B == 168 )); then
            REJECT="RFC 1918 private (192.168.0.0/16)"
          elif (( A == 127 )); then
            REJECT="loopback (127.0.0.0/8)"
          elif (( A == 169 && B == 254 )); then
            REJECT="link-local (169.254.0.0/16)"
          elif (( A >= 224 && A <= 239 )); then
            REJECT="multicast (224.0.0.0/4)"
          elif (( A == 0 )); then
            REJECT="reserved (0.0.0.0/8)"
          fi

          if [ -n "$REJECT" ]; then
            echo "::error::authorized_ip must be a public IP. Got $REJECT: $IP_NUM"
            echo "::error::Get your public IP with: curl ifconfig.me"
            exit 1
          fi

          echo "✓ IP range valid (public): $IP"

      # admin_group_id decides who can administer the cluster, so a wrong value is
      # expensive: it is well-formed, the deploy succeeds, and you only discover
      # it ~20 minutes later when kubectl returns "User does not have access to
      # the resource in Azure". Shape is checked here; the group itself is
      # verified after login, below.
      - name: Validate admin group ID format
        run: |
          GID="${{ github.event.inputs.admin_group_id }}"
          if [[ ! "$GID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::admin_group_id must be a GUID (the group's OBJECT ID, not its name). Got: $GID"
            echo "::error::Find it with: az ad group show --group '<name>' --query id -o tsv"
            exit 1
          fi
          echo "✓ Admin group ID is a well-formed GUID"

      # Only runs IF you supplied an existing workspace. Regex-checks it's a valid
      # Log Analytics resource ID. nocasematch handles Azure's inconsistent casing
      # (resourceGroups vs resourcegroups).
      - name: Validate existing workspace ID format
        if: github.event.inputs.existing_workspace_id != ''
        run: |
          WS="${{ github.event.inputs.existing_workspace_id }}"
          shopt -s nocasematch
          if [[ ! "$WS" =~ ^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.operationalinsights/workspaces/[^/]+$ ]]; then
            echo "::error::existing_workspace_id is not a valid resource ID."
            echo "Expected: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.OperationalInsights/workspaces/{name}"
            echo "Got: $WS"
            exit 1
          fi
          shopt -u nocasematch
          echo "✓ Existing workspace ID valid"
          echo "  Using workspace: $(echo $WS | awk -F'/' '{print $NF}')"

      # First real cloud contact — OIDC login, no stored password (see header).
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Proves the OIDC login actually worked and prints which subscription we're in.
      - name: Verify Azure access
        run: |
          az account show --query "{subscription:name, id:id, tenant:tenantId}" -o table
          echo "✓ Azure login successful"

      # Best-effort identity check. Prints the group's NAME and member count so a
      # plausible-but-wrong group is obvious BEFORE the cluster is built --
      # "AKS-AdversaryLab-Admins, 1 member" reads very differently from
      # "aks-admins, 2 members" when you expected two admins.
      #
      # Degrades gracefully: the OIDC service principal holds Azure RBAC roles,
      # not necessarily Microsoft Graph directory permissions, so it may not be
      # able to read the directory at all. That is a warning, not a failure --
      # we refuse to block a deploy over a check we were not granted the rights
      # to perform. An empty group IS fatal: it yields a cluster no human can
      # administer, which is never what anyone wanted.
      - name: Verify admin group exists and has members
        run: |
          GID="${{ github.event.inputs.admin_group_id }}"

          if ! GROUP_JSON=$(az ad group show --group "$GID" -o json 2>&1); then
            if echo "$GROUP_JSON" | grep -qiE "Authorization_RequestDenied|Insufficient privileges|forbidden"; then
              echo "::warning::Cannot read the directory to verify the admin group — skipping."
              echo "::warning::Grant the deploy identity Microsoft Graph Group.Read.All to enable this check."
              exit 0
            fi
            echo "::error::Admin group $GID not found in this tenant."
            echo "::error::Pass the group's OBJECT ID. List candidates with: az ad group list -o table"
            exit 1
          fi

          NAME=$(echo "$GROUP_JSON" | jq -r '.displayName')

          if ! MEMBERS=$(az ad group member list --group "$GID" --query "length(@)" -o tsv 2>&1); then
            echo "::warning::Found group '$NAME' but could not list its members."
            exit 0
          fi

          echo "Admin group : $NAME"
          echo "Members     : $MEMBERS"

          if [ "$MEMBERS" -eq 0 ]; then
            echo "::error::Group '$NAME' has no members — nobody could administer this cluster."
            exit 1
          fi

          az ad group member list --group "$GID" \
            --query "[].{name:displayName, upn:userPrincipalName}" -o table || true

          {
            echo "### Cluster admin group"
            echo ""
            echo "**$NAME** — $MEMBERS member(s). Confirm this is the group you meant."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "✓ Admin group verified: $NAME ($MEMBERS member(s))"

      - name: Verify existing workspace exists
        if: github.event.inputs.existing_workspace_id != ''
        run: |
          WS_ID="${{ github.event.inputs.existing_workspace_id }}"
          RESULT=$(az resource show --ids "$WS_ID" --query "name" -o tsv 2>&1) || {
            echo "::error::Existing workspace not found or not accessible: $WS_ID"
            exit 1
          }
          echo "✓ Workspace verified: $RESULT"

  # ── Job 2 of 3: deploy ─────────────────────────────────────────────────────
  # Runs ONLY if action == 'deploy'. Builds the whole stack in dependency order:
  # Bicep infra → K8s namespaces → RBAC → network policies → Falco → monitoring →
  # victim apps → red-team tools. Runs on a FRESH VM, so it re-checks-out and
  # re-logs-in (nothing carries over from preflight).
  deploy:
    name: Deploy lab
    runs-on: ubuntu-latest
    environment: lab
    needs: preflight
    if: github.event.inputs.action == 'deploy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      # Versions are PINNED, and not only for reproducibility. With the default
      # `latest`, `az aks install-cli` calls the GitHub API unauthenticated to
      # resolve kubelogin's newest release — and Actions runners share IP pools
      # that routinely exhaust the anonymous rate limit:
      #     urllib.error.HTTPError: HTTP Error 403: rate limit exceeded
      # That took down a deploy here. Passing an explicit version skips the
      # lookup and downloads directly, so the deploy no longer depends on
      # anonymous GitHub API quota. Bump these deliberately.
      - name: Install kubectl + kubelogin
        env:
          KUBECTL_VERSION: v1.34.0      # matches the kubeconform target in validate.yaml
          KUBELOGIN_VERSION: v0.2.19
        run: |
          az aks install-cli \
            --client-version "$KUBECTL_VERSION" \
            --kubelogin-version "$KUBELOGIN_VERSION"
          kubectl version --client
          kubelogin --version
          echo "✓ kubectl $KUBECTL_VERSION and kubelogin $KUBELOGIN_VERSION installed"

      - name: Workspace mode
        run: |
          if [ -n "${{ github.event.inputs.existing_workspace_id }}" ]; then
            WS_NAME=$(echo "${{ github.event.inputs.existing_workspace_id }}" | awk -F'/' '{print $NF}')
            echo "📋 Using existing workspace: $WS_NAME"
            echo "   (activity log forwarding will be skipped — assumed already configured)"
          else
            echo "🆕 Creating new Log Analytics workspace"
            echo "   (activity log forwarding will be enabled)"
          fi

      - name: Create resource group
        run: |
          az group create \
            --name "${{ env.RESOURCE_GROUP }}" \
            --location "${{ github.event.inputs.location }}" \
            --tags \
              Environment=SecurityLab \
              Project=AKS-Adversary-Lab \
              DeployedBy="${{ github.actor }}" \
              DeployedAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "✓ Resource group ready: ${{ env.RESOURCE_GROUP }}"

      # The big one: AKS cluster, ACR, Key Vault, Log Analytics, networking,
      # policies. `id: bicep` + writing to $GITHUB_OUTPUT below exports the
      # deployment outputs (cluster name, workspace id, ACR, Key Vault, ...) so
      # every LATER step can read them via steps.bicep.outputs.*.
      - name: Deploy main stack (Bicep)
        id: bicep
        run: |
          PARAMS=(
            namePrefix="${{ github.event.inputs.name_prefix }}"
            location="${{ github.event.inputs.location }}"
            adminGroupObjectId="${{ github.event.inputs.admin_group_id }}"
            authorizedIpRange="${{ github.event.inputs.authorized_ip }}"
          )

          if [ -n "${{ github.event.inputs.existing_workspace_id }}" ]; then
            PARAMS+=(existingWorkspaceResourceId="${{ github.event.inputs.existing_workspace_id }}")
          fi

          OUTPUT=$(az deployment group create \
            --name "aks-lab-$(date +%s)" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters "${PARAMS[@]}" \
            --query "properties.outputs" -o json)

          echo "$OUTPUT" | jq .

          echo "cluster_name=$(echo $OUTPUT    | jq -r '.clusterName.value')"         >> $GITHUB_OUTPUT
          echo "workspace_id=$(echo $OUTPUT    | jq -r '.logAnalyticsWorkspaceId.value')" >> $GITHUB_OUTPUT
          echo "workspace_name=$(echo $OUTPUT  | jq -r '.logAnalyticsWorkspaceName.value')" >> $GITHUB_OUTPUT
          echo "workspace_is_new=$(echo $OUTPUT | jq -r '.workspaceIsNew.value')"     >> $GITHUB_OUTPUT
          echo "acr_server=$(echo $OUTPUT      | jq -r '.acrLoginServer.value')"      >> $GITHUB_OUTPUT
          echo "keyvault_name=$(echo $OUTPUT   | jq -r '.keyVaultName.value')"        >> $GITHUB_OUTPUT
          echo "detections_deployed=$(echo $OUTPUT | jq -r '.detectionRulesDeployed.value')" >> $GITHUB_OUTPUT
          echo "detections_enabled=$(echo $OUTPUT  | jq -r '.detectionRulesEnabled.value')"  >> $GITHUB_OUTPUT

          echo "✓ Main stack deployed"

      # A SECOND, separate Bicep deploy at SUBSCRIPTION scope (not RG scope) for
      # things that live above the resource group: Defender for Cloud plans and
      # activity-log forwarding. Forwarding is only enabled when creating a NEW
      # workspace (if you brought your own, it assumes that's already wired up).
      - name: Deploy subscription-scope resources
        run: |
          if [ -n "${{ github.event.inputs.existing_workspace_id }}" ]; then
            ENABLE_ACTIVITY_LOG="false"
          else
            ENABLE_ACTIVITY_LOG="true"
          fi

          az deployment sub create \
            --name "aks-lab-sub-$(date +%s)" \
            --location "${{ github.event.inputs.location }}" \
            --template-file infrastructure/main_subscription.bicep \
            --parameters \
              logAnalyticsWorkspaceId="${{ steps.bicep.outputs.workspace_id }}" \
              enableActivityLogForwarding="$ENABLE_ACTIVITY_LOG" \
            --query "properties.provisioningState" -o tsv
          echo "✓ Subscription-scope resources deployed"

      # The Bicep locked the API server to YOUR authorized_ip, but this GitHub
      # runner has a different IP and needs kubectl access. So: discover the
      # runner's public IP and APPEND it to the allowlist (note the trailing
      # ,${RUNNER_IP}/32 — it adds, doesn't clobber your IP). The final step of
      # this job removes it again (grant-then-revoke).
      - name: Allowlist runner IP on AKS API server
        id: runner_ip
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT

          CURRENT_RANGES=$(az aks show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ steps.bicep.outputs.cluster_name }}" \
            --query "apiServerAccessProfile.authorizedIpRanges" -o tsv | tr '\n' ',' | sed 's/,$//')

          NEW_RANGES="${CURRENT_RANGES},${RUNNER_IP}/32"

          az aks update \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ steps.bicep.outputs.cluster_name }}" \
            --api-server-authorized-ip-ranges "$NEW_RANGES"

          echo "✓ Runner IP added to allowlist (will be removed at end of job)"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ steps.bicep.outputs.cluster_name }}" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl cluster-info
          echo "✓ kubectl configured"

      # ── K8s layers, applied as two Kustomize overlays ───────────────────────
      # platform → Falco → workloads. The split exists because Falco (the runtime
      # detector) must be watching BEFORE the victim and attacker workloads start,
      # otherwise the first minutes of the attack surface are unobserved.
      #
      # Within an overlay ordering is automatic: kubectl applies Namespaces and
      # RBAC ahead of the objects that depend on them, so the previous
      # namespaces → rbac → netpol → monitoring sequence collapses into one apply.
      #
      # Every object carries app.kubernetes.io/part-of=adversary-lab, which is
      # what a future `--prune` would select on.
      - name: Apply platform layer (namespaces, RBAC, network policies, monitoring)
        run: |
          kubectl apply -k kubernetes/overlays/platform
          kubectl get namespaces -l app.kubernetes.io/part-of=adversary-lab
          echo "✓ Platform layer applied"

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Falco IS the runtime detection plane. `continue-on-error` keeps a slow
      # install from aborting a 20-minute deploy, but — unlike a swallowed exit
      # code — it marks the step failed so the outcome stays visible. The step
      # below turns that into a loud warning and a job-summary line.
      - name: Deploy Falco
        id: falco
        continue-on-error: true
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm dependency update helm/falco
          helm upgrade --install falco helm/falco \
            --namespace monitoring \
            --create-namespace \
            --wait \
            --timeout 10m
          echo "✓ Falco deployed and ready"

      - name: Flag degraded runtime detection
        if: steps.falco.outcome == 'failure'
        run: |
          echo "::warning::Falco did not become ready — RUNTIME DETECTION IS DOWN."
          echo "Attack simulations will not produce Falco alerts until this is fixed."
          {
            echo "### ⚠️ Falco unhealthy — runtime detection degraded"
            echo ""
            echo "The Helm install did not converge. Falco rules will NOT fire."
            echo ""
            echo '```'
            echo "kubectl get pods -n monitoring"
            echo "kubectl logs -n monitoring -l app.kubernetes.io/name=falco --tail=50"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy workloads (victim apps + red-team tooling)
        id: victim
        continue-on-error: true
        run: |
          kubectl apply -k kubernetes/overlays/workloads
          kubectl rollout status deployment -n victim --timeout=3m

      - name: Flag victim apps not ready
        if: steps.victim.outcome == 'failure'
        run: |
          echo "::warning::Victim workloads did not reach Ready — attack targets may be missing."
          kubectl get pods -n victim || true
          echo "### ⚠️ Victim apps not ready — some attack targets unavailable" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  AKS Adversary Lab — Deployed"
          echo "════════════════════════════════════════════════════════"
          echo ""
          echo "  Cluster   : ${{ steps.bicep.outputs.cluster_name }}"
          echo "  ACR       : ${{ steps.bicep.outputs.acr_server }}"
          echo "  Key Vault : ${{ steps.bicep.outputs.keyvault_name }}"
          echo "  Workspace : ${{ steps.bicep.outputs.workspace_name }}"
          echo "  Detections: ${{ steps.bicep.outputs.detections_enabled }} enabled of ${{ steps.bicep.outputs.detections_deployed }} deployed Sentinel analytics rules"
          if [ "${{ steps.bicep.outputs.workspace_is_new }}" = "true" ]; then
            echo "             (newly created)"
          else
            echo "             (existing — data will appear alongside pre-existing logs)"
          fi
          echo ""
          echo "  Connect:"
          echo "  az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ steps.bicep.outputs.cluster_name }}"
          echo "  kubelogin convert-kubeconfig -l azurecli"
          echo ""
          kubectl get pods -A --field-selector=status.phase=Running 2>/dev/null | head -30

      # Counterpart to the earlier "Allowlist runner IP" step. `if: always()` means
      # this runs EVEN IF an earlier step failed — it restores the allowlist to
      # your original authorized_ip, closing the runner's temporary access. The
      # runner's window into the API server is open only for this job's duration.
      - name: Remove runner IP from AKS allowlist
        if: always() && steps.runner_ip.outputs.ip != ''
        run: |
          ORIGINAL_RANGES="${{ github.event.inputs.authorized_ip }}"

          # NO `|| echo` here, deliberately. This closes the runner's temporary
          # window into the API server. If it fails and the run still went green,
          # that access would stay open with nobody watching the logs for it — so
          # a failure to restore a security control fails the run.
          if ! az aks update \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ steps.bicep.outputs.cluster_name }}" \
            --api-server-authorized-ip-ranges "$ORIGINAL_RANGES"; then
            echo "::error::FAILED to remove the runner IP from the AKS allowlist."
            echo "::error::Runner ${{ steps.runner_ip.outputs.ip }}/32 may still have API server access — remove it manually:"
            echo "::error::  az aks update -g ${{ env.RESOURCE_GROUP }} -n ${{ steps.bicep.outputs.cluster_name }} --api-server-authorized-ip-ranges $ORIGINAL_RANGES"
            exit 1
          fi
          echo "✓ Allowlist restored to original ($ORIGINAL_RANGES)"

  # ── Job 3 of 3: destroy ────────────────────────────────────────────────────
  # Runs ONLY if action == 'destroy'. It's more than one `az group delete` because
  # two things fight a naive delete: (1) the AKS node RG has a ReadOnly lock — see
  # the comment on the cluster-delete step below — and (2) a subscription-scope
  # policy assignment lives ABOVE the RG and survives its deletion. This job
  # handles both, in the right order, and is safe to re-run (idempotent).
  destroy:
    name: Destroy lab
    runs-on: ubuntu-latest
    environment: lab
    needs: preflight
    if: github.event.inputs.action == 'destroy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm target
        run: |
          echo "⚠️  About to delete resource group: ${{ env.RESOURCE_GROUP }}"
          echo "    Triggered by: ${{ github.actor }}"
          if [ -n "${{ github.event.inputs.existing_workspace_id }}" ]; then
            WS_NAME=$(echo "${{ github.event.inputs.existing_workspace_id }}" | awk -F'/' '{print $NF}')
            echo "    ℹ️  Existing workspace '$WS_NAME' will NOT be deleted"
          fi

      # ── Delete cluster first to respect AKS node-RG deny assignment ─────────
      # AKS auto-creates a node resource group with `restrictionLevel: 'ReadOnly'`,
      # which adds a deny assignment that blocks deletion of node-RG resources by
      # anyone other than AKS itself. Deleting the cluster first lets AKS dismantle
      # the node RG cleanly. Skipping this causes az group delete to fail with:
      #   DenyAssignmentAuthorizationFailed: kubernetes.azure.com/.../nrg-lockdown
      - name: Delete AKS cluster (synchronous — triggers node RG cleanup)
        run: |
          # Find the cluster in the lab RG (handles cases where name_prefix
          # differs across deploys, RG was partially created, etc.)
          CLUSTER_NAME=$(az aks list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[0].name" -o tsv 2>/dev/null || echo "")

          if [ -n "$CLUSTER_NAME" ] && [ "$CLUSTER_NAME" != "null" ]; then
            echo "Deleting AKS cluster: $CLUSTER_NAME"
            echo "(This also removes the auto-managed node RG via AKS — typically 5-10 min)"
            az aks delete \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --name "$CLUSTER_NAME" \
              --yes
            echo "✓ Cluster deleted, node RG cleaned up by AKS"
          else
            echo "· No AKS cluster found in RG — skipping cluster delete"
          fi

      - name: Delete resource group
        run: |
          EXISTS=$(az group exists --name "${{ env.RESOURCE_GROUP }}")
          if [ "$EXISTS" = "true" ]; then
            az group delete \
              --name "${{ env.RESOURCE_GROUP }}" \
              --yes \
              --no-wait
            echo "✓ Delete initiated: ${{ env.RESOURCE_GROUP }}"
            echo "  Resources are being removed asynchronously (~5-10 min)"
          else
            echo "· Resource group not found — already deleted or never created"
          fi

      # The 'aks-lab-mitre-logging' policy assignment lives at SUBSCRIPTION scope,
      # above the RG, so deleting the RG doesn't remove it. Without this cleanup,
      # repeated deploy/destroy cycles would leave dangling policy assignments.
      - name: Clean up orphaned policy assignments
        run: |
          echo "Checking for orphaned subscription-scope policy assignments..."
          ASSIGNMENTS=$(az policy assignment list \
            --scope "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "[?name=='aks-lab-mitre-logging'].id" \
            -o tsv)

          if [ -n "$ASSIGNMENTS" ]; then
            echo "$ASSIGNMENTS" | while read ID; do
              az policy assignment delete --id "$ID"
              echo "  Deleted: $ID"
            done
          else
            echo "  None found"
          fi

      - name: Destroy summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  AKS Adversary Lab — Destroyed"
          echo "════════════════════════════════════════════════════════"
          echo ""
          echo "  Resource group deletion initiated: ${{ env.RESOURCE_GROUP }}"
          echo ""
          echo "  The following are NOT removed and persist at subscription scope:"
          echo "    · Defender for Cloud pricing tiers"
          echo "    · Custom policy definitions"
          if [ -n "${{ github.event.inputs.existing_workspace_id }}" ]; then
            echo "    · Log Analytics workspace (was pre-existing, intentionally preserved)"
          fi
          echo ""
