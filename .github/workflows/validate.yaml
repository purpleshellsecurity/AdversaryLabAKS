name: Validate AKS Adversary Lab

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Parallel validation ─────────────────────────────────────────

  bicep-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bicep
        run: |
          az bicep install
          az bicep version

      - name: Validate main.bicep
        run: az bicep build --file infrastructure/main.bicep

      - name: Validate main_subscription.bicep
        run: az bicep build --file infrastructure/main_subscription.bicep

      - name: Validate all modules
        run: |
          for f in infrastructure/modules/*.bicep; do
            echo "Checking $f..."
            az bicep build --file "$f"
          done

  powershell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

          $excludeRules = @(
            'PSAvoidUsingWriteHost',
            'PSAvoidUsingInvokeExpression',
            'PSReviewUnusedParameter',
            'PSAvoidUsingPlainTextForPassword',
            'PSAvoidUsingConvertToSecureStringWithPlainText',
            'PSUseSingularNouns',
            'PSUseBOMForUnicodeEncodedFile',
            'PSUseDeclaredVarsMoreThanAssignments',
            'PSUseShouldProcessForStateChangingFunctions',
            'PSShouldProcess',
            'PSUseApprovedVerbs'
          )

          $results = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Severity Warning,Error `
            -ExcludeRule $excludeRules

          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "PSScriptAnalyzer found $($results.Count) issue(s)" -ForegroundColor Red
            exit 1
          }

          Write-Host "No issues found!" -ForegroundColor Green

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  k8s-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          find kubernetes/ -name "*.yaml" -o -name "*.yml" | while read f; do
            echo "Validating $f..."
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              -kubernetes-version 1.34.0 \
              "$f"
          done

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate Falco chart
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm dependency update helm/falco
          # Version is declared in helm/falco/Chart.yaml (Dependabot watches it).
          # Assert the custom rules actually render — catches broken value nesting.
          helm template falco helm/falco | grep -q "adversary-lab-rules" \
            && echo "Falco chart valid (custom rules present)" \
            || { echo "ERROR: rendered chart is missing custom rules"; exit 1; }

  detection-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tools/detection-validator/requirements.txt

      - name: Validate detection rules
        run: |
          python tools/detection-validator/validate.py \
            --detections-dir detections \
            --verbose

  # ── Tier 1: detection LOGIC test (offline, no cloud) ─────────────────────
  # Runs each real .kql against recorded event fixtures inside the Kusto emulator
  # and asserts it fires on the malicious sample and stays silent on the benign
  # one. Proves the query LOGIC end-to-end without an AKS cluster or Log Analytics.
  detection-logic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
        ports:
          - 8080:8080
        env:
          ACCEPT_EULA: "Y"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/detection-tester/requirements.txt

      - name: Run KQL detection logic tests
        env:
          KUSTO_ENDPOINT: http://localhost:8080
          KUSTO_DB: NetDefaultDB
        run: |
          python tools/detection-tester/kql_test.py \
            --tests-dir detections/kql/tests \
            --repo-root . \
            --wait-seconds 180

  # ── Tier 2: Falco RUNTIME test (live syscalls, no cloud) ─────────────────
  # Runs Falco (modern eBPF) on the runner with the repo's custom rules, fires a
  # safe trigger container per rule, and asserts the expected rule name appears in
  # Falco's JSON output. Proves the syscall rules end-to-end without an AKS cluster.
  falco-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Falco with the repo's custom rules (modern eBPF)
        run: |
          docker run -d --name falco \
            --privileged \
            -v /proc:/host/proc:ro \
            -v "${GITHUB_WORKSPACE}/detections/falco:/etc/falco/rules.d:ro" \
            falcosecurity/falco:latest \
            falco -o engine.kind=modern_ebpf \
                  -o json_output=true \
                  -o stdout_output.enabled=true \
                  -o log_level=info \
                  -o priority=debug

      - name: Wait for Falco to attach the driver and load rules
        run: |
          for i in $(seq 1 40); do
            if docker logs falco 2>&1 | grep -qiE "loading rules|rules? loaded|starting internal webserver|falco initialized|actual rules"; then
              echo "Falco is up (iteration $i)"; sleep 6; exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^falco$'; then
              echo "Falco container exited early — logs follow:"; docker logs falco 2>&1 | tail -80; exit 1
            fi
            sleep 3
          done
          echo "Falco did not report readiness in time — logs follow:"
          docker logs falco 2>&1 | tail -80
          exit 1

      - name: Fire runtime triggers and assert rules fired
        run: |
          set +e
          python tools/detection-tester/falco_test.py \
            --tests-dir detections/falco/tests \
            --container falco \
            --settle-seconds 10
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "=== Falco container logs (tail) ==="
            docker logs falco 2>&1 | tail -100
          fi
          exit $rc

  python-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r tools/ -f txt -ll
        # -ll = only medium severity and above
        # Switch to CodeQL when repo goes public (requires GHAS on private repos)

  exception-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Warn on expired security exceptions (non-blocking)
        run: python3 tools/check-exceptions.py

  # ── Stage 2: IaC scanning (needs bicep-validate) ─────────────────────────

  iac-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: bicep-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/
          framework: bicep
          soft_fail: true

  # ── Stage 3: Container scanning ──────────────────────────────────────────

  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: k8s-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Juice Shop container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bkimminich/juice-shop:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0     # soft fail — Juice Shop is intentionally vulnerable
                           # change to 1 when scanning your own images
                           # Switch to sarif + upload-sarif when repo goes public (requires GHAS)
