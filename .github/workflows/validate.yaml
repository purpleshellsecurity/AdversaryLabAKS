name: Validate AKS Adversary Lab

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Parallel validation ─────────────────────────────────────────

  bicep-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bicep
        run: |
          az bicep install
          az bicep version

      - name: Validate main.bicep
        run: az bicep build --file infrastructure/main.bicep

      - name: Validate main_subscription.bicep
        run: az bicep build --file infrastructure/main_subscription.bicep

      - name: Validate all modules
        run: |
          for f in infrastructure/modules/*.bicep; do
            echo "Checking $f..."
            az bicep build --file "$f"
          done

  powershell-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

          $excludeRules = @(
            'PSAvoidUsingWriteHost',
            'PSAvoidUsingInvokeExpression',
            'PSReviewUnusedParameter',
            'PSAvoidUsingPlainTextForPassword',
            'PSAvoidUsingConvertToSecureStringWithPlainText',
            'PSUseSingularNouns',
            'PSUseBOMForUnicodeEncodedFile',
            'PSUseDeclaredVarsMoreThanAssignments',
            'PSUseShouldProcessForStateChangingFunctions',
            'PSShouldProcess',
            'PSUseApprovedVerbs'
          )

          $results = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Severity Warning,Error `
            -ExcludeRule $excludeRules

          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "PSScriptAnalyzer found $($results.Count) issue(s)" -ForegroundColor Red
            exit 1
          }

          Write-Host "No issues found!" -ForegroundColor Green

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  k8s-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          find kubernetes/ -name "*.yaml" -o -name "*.yml" | while read f; do
            echo "Validating $f..."
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              -kubernetes-version 1.34.0 \
              "$f"
          done

  helm-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate Falco values
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo update
          helm template falco falcosecurity/falco \
            -f helm/falco-values.yaml \
            --dry-run \
            > /dev/null && echo "Falco values are valid"

  detection-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tools/detection-validator/requirements.txt

      - name: Validate detection rules
        run: |
          python tools/detection-validator/validate.py \
            --detections-dir detections \
            --verbose

  python-sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r tools/ -f txt -ll
        # -ll = only medium severity and above
        # Switch to CodeQL when repo goes public (requires GHAS on private repos)

  # ── Stage 2: IaC scanning (needs bicep-validate) ─────────────────────────

  iac-scan:
    runs-on: ubuntu-latest
    needs: bicep-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/
          framework: bicep
          soft_fail: true

  # ── Stage 3: Container scanning ──────────────────────────────────────────

  trivy-scan:
    runs-on: ubuntu-latest
    needs: k8s-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Juice Shop container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bkimminich/juice-shop:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0     # soft fail — Juice Shop is intentionally vulnerable
                           # change to 1 when scanning your own images
                           # Switch to sarif + upload-sarif when repo goes public (requires GHAS)
