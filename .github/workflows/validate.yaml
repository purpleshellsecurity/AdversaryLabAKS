# =============================================================================
# validate.yaml — Continuous Integration (CI) gate
# =============================================================================
# Runs AUTOMATICALLY on every PR to main and every push to main. It only inspects
# files in the repo — it NEVER logs into Azure or changes any cloud resource
# (note: no `permissions: id-token` and no `azure/login` anywhere below, and the
# GITHUB_TOKEN is capped at read-only — see the Permissions block). That is what
# makes it safe to run on every commit. Its job is to answer: "is the code in
# this repo correct and safe to merge?"
#
# Full walkthrough: docs/WORKFLOWS-EXPLAINED.md
# =============================================================================
name: Validate AKS Adversary Lab

# ── Permissions ──────────────────────────────────────────────────────────────
# Default-deny ceiling for GITHUB_TOKEN. Without this block the token inherits
# the REPOSITORY default, which may be read-write — on the workflow with the
# widest trigger surface (every PR, including from forks) and the least scrutiny.
# Nothing here writes to the repo, so read-only costs us nothing and caps the
# blast radius if any third-party action below is ever compromised.
permissions:
  contents: read

# ── Triggers ─────────────────────────────────────────────────────────────────
# Runs while you iterate on a PR (pull_request) and again after it merges (push).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# ── Concurrency ──────────────────────────────────────────────────────────────
# One run "slot" per workflow+branch. cancel-in-progress: true means a newer push
# CANCELS the older still-running validation — you only care about the latest
# commit's result, so this saves runner minutes. (deploy.yaml does the opposite.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Parallel validation ─────────────────────────────────────────
  # Every job below runs on its own fresh VM, all at once (no `needs:`), because
  # they're independent. Stages 2 and 3 further down each wait on one of these.

  # Compiles all Bicep. `az bicep build` fails on syntax errors and surfaces
  # linter warnings — catches broken IaC in seconds instead of mid-deploy.
  bicep-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bicep
        run: |
          az bicep install
          az bicep version

      - name: Validate main.bicep
        run: az bicep build --file infrastructure/main.bicep

      - name: Validate main_subscription.bicep
        run: az bicep build --file infrastructure/main_subscription.bicep

      - name: Validate all modules
        run: |
          for f in infrastructure/modules/*.bicep; do
            echo "Checking $f..."
            az bicep build --file "$f"
          done

  # infrastructure/main.json is the COMPILED ARM output of main.bicep, committed
  # to the repo. Nothing else produces or consumes it — deploy.yaml deploys from
  # the .bicep directly — so without this job an edit to main.bicep that skipped
  # the recompile would leave the JSON describing infrastructure that no longer
  # exists, and nothing would notice.
  #
  # Separate job from bicep-validate ON PURPOSE. That job lints with CURRENT
  # Bicep so new compiler warnings surface. This one pins the version, because
  # different Bicep versions emit different JSON for identical source and the
  # comparison is only meaningful when the compiler matches. A version mismatch
  # exits 2 ("cannot verify"), never 1 ("stale") — see tools/check-arm-parity.py.
  arm-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Bicep
        run: |
          VERSION="$(cat infrastructure/.bicep-version)"
          echo "Installing Bicep v$VERSION (pin from infrastructure/.bicep-version)"
          az bicep install --version "v$VERSION"
          az bicep version

      - name: Assert main.json matches main.bicep
        run: python tools/check-arm-parity.py

  # Lints all PowerShell with PSScriptAnalyzer at Warning+Error severity, failing
  # the job on any finding. The $excludeRules list below is the set of rules we
  # deliberately silence because they don't fit this repo's style (e.g. we use
  # Write-Host on purpose for colored output) — each one is an intentional choice.
  powershell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

          $excludeRules = @(
            'PSAvoidUsingWriteHost',
            'PSAvoidUsingInvokeExpression',
            'PSReviewUnusedParameter',
            'PSAvoidUsingPlainTextForPassword',
            'PSAvoidUsingConvertToSecureStringWithPlainText',
            'PSUseSingularNouns',
            'PSUseBOMForUnicodeEncodedFile',
            'PSUseDeclaredVarsMoreThanAssignments',
            'PSUseShouldProcessForStateChangingFunctions',
            'PSShouldProcess',
            'PSUseApprovedVerbs'
          )

          $results = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Severity Warning,Error `
            -ExcludeRule $excludeRules

          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "PSScriptAnalyzer found $($results.Count) issue(s)" -ForegroundColor Red
            exit 1
          }

          Write-Host "No issues found!" -ForegroundColor Green

  # Scans git history for leaked secrets with TruffleHog. fetch-depth: 0 pulls the
  # ENTIRE history (not just the latest commit) so every past commit is scanned.
  # --only-verified fails ONLY on secrets it can actively confirm are live, which
  # keeps false positives near zero — a random-looking string won't break the build.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318  # v3.97.0
        with:
          path: ./
          extra_args: --only-verified

  # Validates every K8s manifest under kubernetes/ against the 1.34 API schemas.
  # -strict rejects unknown fields (catches typos in field names);
  # -ignore-missing-schemas tolerates CRDs (Falco, Sentinel) kubeconform can't know.
  k8s-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          find kubernetes/ -name "*.yaml" -o -name "*.yml" | while read f; do
            echo "Validating $f..."
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              -kubernetes-version 1.34.0 \
              "$f"
          done

  # Two distinct checks on the Falco deployment path:
  #   1. PARITY  — helm/falco/values.yaml is GENERATED from detections/falco/*.yaml.
  #      Only values.yaml is ever deployed, so a rule tuned in the source file but
  #      not regenerated would leave the cluster silently running the old logic.
  #      This gate makes that impossible to merge.
  #   2. RENDER  — a mis-nested value makes Helm silently DROP the custom rules
  #      without erroring, so we render the chart and grep the OUTPUT to prove
  #      they survived. Turns a silent drop into a loud CI failure.
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/detection-validator/requirements.txt

      # Compares every source rule against the deployed copy field-by-field and
      # names exactly which rule and which field drifted.
      - name: Assert Falco rules match their source
        run: python tools/build-falco-rules.py --check

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate Falco chart
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm dependency update helm/falco
          # Version is declared in helm/falco/Chart.yaml (Dependabot watches it).
          # Assert the custom rules actually render — catches broken value nesting.
          helm template falco helm/falco | grep -q "adversary-lab-rules" \
            && echo "Falco chart valid (custom rules present)" \
            || { echo "ERROR: rendered chart is missing custom rules"; exit 1; }

  # STRUCTURAL check of every KQL + Falco rule: required fields present, MITRE
  # ATT&CK IDs mapped, files well-formed. Answers "is this rule authored
  # correctly?" — NOT "does the query actually detect the attack?" (that's the
  # next job, detection-logic-test).
  detection-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tools/detection-validator/requirements.txt

      - name: Validate detection rules
        run: |
          python tools/detection-validator/validate.py \
            --detections-dir detections \
            --verbose

      # Structure is not enough: a rule can be perfectly authored and still never
      # deploy. This asserts every detection has a metadata sidecar, is referenced
      # by infrastructure/modules/aks_detections.bicep, and maps entities to
      # columns its query actually projects.
      - name: Check detection deployment wiring
        run: python tools/check-detection-wiring.py

  # ── Tier 1: detection LOGIC test (offline, no cloud) ─────────────────────
  # Runs each real .kql against recorded event fixtures inside the Kusto emulator
  # and asserts it fires on the malicious sample and stays silent on the benign
  # one. Proves the query LOGIC end-to-end without an AKS cluster or Log Analytics.
  detection-logic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `services:` starts a REAL Kusto engine (the same query engine Log Analytics
    # uses) as a sidecar container. The test binds recorded event fixtures to the
    # audit table name via `let ... datatable()`, then runs the UNMODIFIED shipped
    # .kql against them — asserting it fires on the malicious sample and stays
    # silent on the benign one. True end-to-end logic test, no cluster required.
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
        ports:
          - 8080:8080
        env:
          ACCEPT_EULA: "Y"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/detection-tester/requirements.txt

      # --wait-seconds 180 gives the Kusto container time to become ready.
      - name: Run KQL detection logic tests
        env:
          KUSTO_ENDPOINT: http://localhost:8080
          KUSTO_DB: NetDefaultDB
        run: |
          python tools/detection-tester/kql_test.py \
            --tests-dir detections/kql/tests \
            --repo-root . \
            --wait-seconds 180

  # Bandit = Python static-analysis security scanner over tools/. -ll limits it to
  # medium-severity-and-above findings.
  python-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r tools/ -f txt -ll
        # -ll = only medium severity and above
        # Switch to CodeQL when repo goes public (requires GHAS on private repos)

  # Reads docs/security-exceptions.yaml and emits ::warning:: annotations for any
  # time-boxed exception past its expiration date. NEVER fails the build (the
  # script always exits 0) — it's a "warn, don't gate" nudge so accepted risks
  # don't silently live forever. Entries with expiration_date: none are skipped.
  exception-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Warn on expired security exceptions (non-blocking)
        run: python3 tools/check-exceptions.py

  # ── Stage 2: IaC scanning (needs bicep-validate) ─────────────────────────
  # Checkov = static misconfiguration scanner for the Bicep. soft_fail: true means
  # it REPORTS but never fails the build — this lab intentionally ships some
  # insecure-by-design infra (it's meant to be attacked). `needs: bicep-validate`
  # so it only runs once the Bicep is known to compile.

  iac-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: bicep-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf  # v12.1347.0
        with:
          directory: infrastructure/
          framework: bicep
          soft_fail: true

  # ── Stage 3: Container scanning ──────────────────────────────────────────
  # Trivy = container CVE scanner. Scans Juice Shop (the deliberately-vulnerable
  # "victim" app), so exit-code: 0 makes it a SOFT fail — flagging its CVEs as
  # build failures would be nonsensical. Flip to exit-code: 1 when scanning your
  # OWN images. `needs: k8s-validate` for the same gating reason as Stage 2.

  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: k8s-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan Juice Shop container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: bkimminich/juice-shop:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0     # soft fail — Juice Shop is intentionally vulnerable
                           # change to 1 when scanning your own images
                           # Switch to sarif + upload-sarif when repo goes public (requires GHAS)
