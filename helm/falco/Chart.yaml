# ============================================================================
# AKS Adversary Lab - Falco umbrella Helm chart (Chart.yaml)
# ----------------------------------------------------------------------------
# PURPOSE: This is the BLUE-TEAM runtime-detection engine. Falco watches kernel
#   syscalls and flags suspicious behavior (shells in containers, token reads,
#   container escapes, crypto mining, cloud-metadata access) generated by the
#   red-team tools against the victim apps.
# WHY AN "UMBRELLA" CHART: rather than install the upstream Falco chart directly,
#   the lab wraps it as a DEPENDENCY of this thin local chart. That lets the lab
#   pin the version and layer its own values (see values.yaml) on top, all under
#   version control.
# apiVersion v2 = Helm 3 chart format.
# ============================================================================
apiVersion: v2
name: falco-lab                                   # this wrapper chart's name
description: Umbrella chart that pins Falco for the AKS Adversary Lab
type: application                                 # deployable app (vs. a reusable "library" chart)
version: 0.1.0                                    # version of THIS umbrella chart (not Falco's)
# Falco chart version lives HERE now (declarative). Bump this line; Dependabot
# opens a PR when a new version ships; CI (helm-lint) validates it.
dependencies:
  - name: falco                                   # the upstream subchart being pulled in
    version: 9.2.0                                # PINNED Falco chart version (reproducible installs)
    repository: https://falcosecurity.github.io/charts  # official Falco Helm repo
