# ============================================================================
# AKS Adversary Lab - Falco umbrella-chart values (values.yaml)
# ----------------------------------------------------------------------------
# Umbrella-chart values for the AKS Adversary Lab.
# The Falco chart is a DEPENDENCY (see Chart.yaml), so all of its values are
# nested under the `falco:` key (the dependency name). `falco.falco` is Falco's
# own falco.yaml config — the repeated name is expected with Helm subcharts.
#
# WHAT THIS CONFIGURES: how Falco (the blue-team runtime-detection engine) runs
# on the AKS nodes, how it emits alerts, and — most importantly for the lab — a
# set of CUSTOM detection rules tuned to the exact attacker behaviors this lab
# generates. Each custom rule maps to a MITRE ATT&CK technique.
# ============================================================================

falco:
  driver:
    # How Falco taps the kernel to observe syscalls. modern_ebpf = the CO-RE eBPF
    # probe: no kernel module to compile, works on recent AKS node kernels.
    kind: modern_ebpf
  collectors:
    kubernetes:
      # Enrich events with Kubernetes context (pod/namespace/image), so alerts
      # say WHICH victim pod was attacked, not just a raw process.
      enabled: true
  falco:
    # ---- Output / logging behavior --------------------------------------
    json_output: true                     # emit alerts as JSON (machine-parseable for SIEM/hunting)
    json_include_output_property: true    # include the human-readable message inside the JSON too
    log_stderr: true                      # send Falco's own logs to stderr (visible via kubectl logs)
    log_syslog: false                     # not also to syslog
    log_level: info                       # verbosity of Falco's internal logs
    rules_files:                          # ordered list of rule files Falco loads
    - /etc/falco/falco_rules.yaml         # upstream default ruleset
    - /etc/falco/falco_rules.local.yaml   # site-local overrides
    - /etc/falco/rules.d                  # directory of extra rules (where customRules land)
  falcosidekick:
    # Falcosidekick fans Falco alerts out to external sinks (Slack, webhooks, etc).
    enabled: true
    config:
      debug: true                         # verbose sidekick logging — handy in a lab, noisy in prod
  tolerations:
  # Let the Falco DaemonSet schedule onto AKS system/critical nodes that carry
  # the CriticalAddonsOnly taint, so detection covers every node.
  - key: CriticalAddonsOnly
    operator: Exists
    effect: NoSchedule
  # ---- Custom detection rules -------------------------------------------
  # ############################################################################
  # #  GENERATED BLOCK — DO NOT EDIT BY HAND                                   #
  # #  Source of truth:  detections/falco/*.yaml                               #
  # #  Regenerate with:  python tools/build-falco-rules.py                     #
  # #  CI enforces parity (validate.yaml -> helm-lint -> --check), so an edit  #
  # #  made here instead of in the source file will fail the build.            #
  # ############################################################################
  # A single YAML file injected into the rules.d directory. It defines
  # lab-specific rules, each tagged with a MITRE technique, covering the
  # attacker behaviors this lab exercises:
  #   * "Read ServiceAccount Token in Container"      -> T1528 (SA token theft)
  #   * "Container Escape via nsenter"                -> T1611 (escape to host)
  #   * "Crypto Mining Process Detected"             -> T1496.001 (resource hijacking)
  #   * "Reverse Shell in Container"                 -> T1059 (reverse shells)
  #   * "Shell Spawned in Container"                 -> T1059 (webshell/interactive shell)
  #   * "Pod Contacted Cloud Instance Metadata..."   -> T1552.005 (IMDS credential theft)
  customRules:
    adversary-lab-rules.yaml: |-
      - rule: Container Escape via nsenter
        desc: Detects nsenter execution which may indicate container escape (MITRE T1611)
        condition: >
          spawned_process and
          container and
          proc.name = nsenter
        output: >
          nsenter executed in container — possible escape attempt
          (user=%user.name command=%proc.cmdline
           container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
           image=%container.image.repository:%container.image.tag)
        priority: CRITICAL   # highest Falco severity — a live escape attempt
        tags: [mitre_privilege_escalation, T1611]   # ATT&CK tactic + technique labels

      - rule: Crypto Mining Process Detected
        desc: Detects known crypto mining binaries or pool connections (MITRE T1496.001)
        condition: >
          spawned_process and
          container and
          (proc.name in (xmrig, minerd, minergate, cpuminer) or
           proc.cmdline contains "stratum+tcp" or
           proc.cmdline contains "pool.minexmr" or
           proc.cmdline contains "cryptonight")
        output: >
          Crypto mining activity detected
          (process=%proc.name command=%proc.cmdline
           container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
           image=%container.image.repository:%container.image.tag)
        priority: CRITICAL   # active resource hijacking — treat as high severity
        tags: [mitre_impact, T1496, T1496.001]   # ATT&CK tactic + technique labels

      - rule: Pod Contacted Cloud Instance Metadata Service
        desc: Detects a container connecting to the Azure IMDS endpoint to steal the node managed identity and pivot into the subscription (MITRE T1552.005)
        condition: >
          outbound and
          container and
          fd.sip = "169.254.169.254"
        output: >
          Container reached cloud metadata endpoint
          (user=%user.name proc=%proc.name cmdline=%proc.cmdline
           connection=%fd.name container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
           image=%container.image.repository:%container.image.tag)
        priority: CRITICAL   # credential-theft pivot into the cloud — high severity
        tags: [mitre_credential_access, T1552.005]   # ATT&CK tactic + technique labels

      - rule: Reverse Shell in Container
        desc: Detects common reverse shell patterns in containers
        condition: >
          spawned_process and
          container and
          (proc.cmdline contains "/dev/tcp/" or
           proc.cmdline contains "bash -i" or
           (proc.name in (nc, ncat, nmap) and proc.cmdline contains "-e"))
        output: >
          Reverse shell detected in container
          (process=%proc.name command=%proc.cmdline
           container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
           image=%container.image.repository:%container.image.tag)
        priority: CRITICAL   # interactive attacker control — high severity
        tags: [mitre_execution, T1059]   # ATT&CK tactic + technique labels

      - rule: Shell Spawned in Container
        desc: Detects an interactive shell started inside a container — a webshell when the parent is the app process (MITRE T1059)
        condition: >
          spawned_process and
          container and
          proc.name in (shell_binaries)
        output: >
          Shell spawned in container
          (user=%user.name proc=%proc.name parent=%proc.pname cmdline=%proc.cmdline
           container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
           image=%container.image.repository:%container.image.tag)
        priority: WARNING   # not CRITICAL: legitimate `kubectl exec` also spawns shells
        tags: [mitre_execution, T1059]   # ATT&CK tactic + technique labels

      - rule: Read ServiceAccount Token in Container
        desc: Detects processes reading the mounted SA token inside a container (MITRE T1528)
        condition: >
          open_read and
          container and
          (fd.name = "/var/run/secrets/kubernetes.io/serviceaccount/token" or
           fd.name = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
        output: >
          SA token read inside container
          (user=%user.name command=%proc.cmdline file=%fd.name
           container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
           image=%container.image.repository:%container.image.tag)
        priority: WARNING   # in-app SDK reads are normal — triage by the reading process
        tags: [mitre_credential_access, T1528]   # ATT&CK tactic + technique labels
