# ============================================================================
# Falco Rule: Shell Spawned in Container
# MITRE ATT&CK: T1059 - Command and Scripting Interpreter
# ============================================================================

# HOW THIS RULE WORKS
# -------------------
# Most production containers never spawn a shell after startup, so a shell process
# appearing inside one is suspicious (T1059). It's especially telling when the
# PARENT is the app process (%proc.pname) — that pattern is a webshell: the running
# app was tricked into launching /bin/sh. Priority is WARNING, not CRITICAL,
# because interactive shells also show up in legitimate `kubectl exec` debugging.
#
# NOTE: condition/output are `>` block scalars — their indented lines are literal
# rule text, so all commentary lives on full lines between the mapping keys.

- rule: Shell Spawned in Container
  desc: Detects an interactive shell started inside a container — a webshell when the parent is the app process (MITRE T1059)
  # condition matches a new in-container process whose name is one of the shells in
  # the Falco-maintained `shell_binaries` list (bash, sh, zsh, ash, ...).
  condition: >
    spawned_process and
    container and
    proc.name in (shell_binaries)
  # output includes the PARENT process (%proc.pname) — the webshell tell — plus the
  # usual container/pod/namespace/image context.
  output: >
    Shell spawned in container
    (user=%user.name proc=%proc.name parent=%proc.pname cmdline=%proc.cmdline
     container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     image=%container.image.repository:%container.image.tag)
  priority: WARNING   # not CRITICAL: legitimate `kubectl exec` also spawns shells
  tags: [mitre_execution, T1059]   # ATT&CK tactic + technique labels
