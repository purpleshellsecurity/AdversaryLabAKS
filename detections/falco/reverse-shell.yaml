# ============================================================================
# Falco Rule: Reverse Shell Detection
# MITRE ATT&CK: T1059 - Command and Scripting Interpreter
# ============================================================================

# HOW THIS RULE WORKS
# -------------------
# A reverse shell connects a shell back out to an attacker-controlled host, giving
# them interactive control of the container (T1059 Command and Scripting
# Interpreter). Falco matches the well-known command-line shapes at process spawn.
#
# NOTE: condition/output are `>` block scalars — their indented lines are literal
# rule text, so all commentary lives on full lines between the mapping keys.

- rule: Reverse Shell in Container
  desc: Detects common reverse shell patterns in containers
  # condition matches a new in-container process whose command line looks like a
  # reverse shell, via any of these classic patterns:
  #   "/dev/tcp/" -> bash's built-in TCP socket redirect trick
  #   "bash -i"   -> an interactive bash, typically piped to a socket
  #   nc/ncat/nmap with "-e" -> netcat-family "exec a program on connect" mode
  condition: >
    spawned_process and
    container and
    (proc.cmdline contains "/dev/tcp/" or
     proc.cmdline contains "bash -i" or
     (proc.name in (nc, ncat, nmap) and proc.cmdline contains "-e"))
  # output names the process/command and its container/pod/namespace/image.
  output: >
    Reverse shell detected in container
    (process=%proc.name command=%proc.cmdline
     container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     image=%container.image.repository:%container.image.tag)
  priority: CRITICAL   # interactive attacker control — high severity
  tags: [mitre_execution, T1059]   # ATT&CK tactic + technique labels
