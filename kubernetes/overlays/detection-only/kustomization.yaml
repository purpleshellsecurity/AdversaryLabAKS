# =============================================================================
# Overlay: detection-only — the lab without the offensive tooling
# =============================================================================
# Platform plus victim apps, no red-team pods. This is the variant that is
# reasonable to leave running: you keep the telemetry, the detections and the
# vulnerable targets, without six long-lived pods holding a broadly-privileged
# ServiceAccount token.
#
# Expressing a variant as an overlay rather than a branch or a commented-out
# block is the point of Kustomize — the difference between lab modes becomes a
# reviewable file instead of a habit.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../namespaces
  - ../../rbac
  - ../../network-policies
  - ../../monitoring
  - ../../victim-apps

labels:
  - pairs:
      app.kubernetes.io/part-of: adversary-lab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
